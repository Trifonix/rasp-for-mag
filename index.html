<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <title>Расписание ПИ ХГПУ</title>
  <link type="Image/x-icon" href="fav.ico" rel="icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <div id="loader" class="loader">
    <span></span><span></span><span></span>
  </div>

  <h1>Расписание занятий</h1>
  <h3>2 курс ОФО маг-р 12-25 РПм Программная инженерия</h3>

  <div class="controls">
    <label class="control-btn" data-view="today"><input type="radio" name="view" value="today" checked /> Сегодня</label>
    <label class="control-btn" data-view="week"><input type="radio" name="view" value="week" /> Эта неделя</label>
    <label class="control-btn" data-view="semester3"><input type="radio" name="view" value="semester3" /> Семестр 3</label>
    <label class="control-btn" data-view="semester2"><input type="radio" name="view" value="semester2" /> Семестр 2</label>
    <label class="control-btn" data-view="semester"><input type="radio" name="view" value="semester" /> Семестр 1</label>
  </div>

  <table>
    <thead>
      <tr>
        <th>Дни недели</th>
        <th>Пара</th>
        <th>Вид занятий</th>
        <th>Дисциплина</th>
        <th>Преподаватель</th>
        <th>Ссылка</th>
      </tr>
    </thead>
    <tbody id="schedule-body"></tbody>
  </table>
</body>

</html>
